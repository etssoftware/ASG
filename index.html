<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram: Join Group Chat</title>
    
    <!-- Meta Pixel Code (Second Page - Lead Tracking) -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e);
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://facebook.net');
    fbq('init', 'YOUR_PIXEL_ID'); // ⚠️ यहाँ अपनी 15 अंकों की Meta Pixel ID डालें
    fbq('track', 'PageView');
    fbq('track', 'Lead'); // पेज लोड होते ही ऑटोमैटिक लीड ट्रैक होगी
    </script>
    <!-- End Meta Pixel Code -->

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            background-image: url('https://telegram.org');
            background-repeat: repeat;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Top Telegram Bar */
        .tg-header {
            width: 100%;
            background: #ffffff;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        .tg-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2481cc;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }
        .tg-logo-icon {
            width: 32px;
            height: 32px;
            background: #2481cc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
        }
        .download-btn {
            background: #2481cc;
            color: white;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }
        /* Main Card Container */
        .card-container {
            margin-top: 90px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 420px;
            padding: 0 16px;
        }
        .tg-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            text-align: center;
        }
        /* Custom App Logo Layout */
        .app-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #111;
            margin: 0 auto 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border: 2px solid #222;
            overflow: hidden;
        }
        .logo-top {
            font-size: 11px;
            color: #4cd964;
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 8px;
        }
        .logo-mid {
            font-size: 12px;
            letter-spacing: 0.5px;
            margin: 4px 0;
            color: #fff;
        }
        .logo-bottom {
            font-size: 11px;
            color: #ff3b30;
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 8px;
        }
        .logo-arrow-up { color: #4cd964; font-size: 14px; }
        .logo-arrow-down { color: #ff3b30; font-size: 14px; }
        
        h2 {
            font-size: 24px;
            color: #000000;
            margin: 0 0 4px 0;
            font-weight: 700;
        }
        .subscribers {
            color: #707579;
            font-size: 14px;
            margin-bottom: 22px;
        }
        .channel-details {
            text-align: left;
            margin: 0 auto 28px;
            font-size: 15px;
            line-height: 1.5;
            color: #000000;
            max-width: 320px;
        }
        .channel-details p {
            margin: 10px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .join-btn {
            display: block;
            background: #2481cc;
            color: white;
            text-decoration: none;
            padding: 13px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            max-width: 280px;
            margin: 0 auto 20px;
            box-shadow: 0 2px 4px rgba(36, 129, 204, 0.2);
        }
        .invite-msg {
            color: #707579;
            font-size: 14px;
            line-height: 1.4;
            max-width: 280px;
            margin: 0 auto;
        }
        .invite-msg strong {
            color: #000000;
        }
    </style>

    <!-- 🚀 डीप लिंकिंग कोड जो बिना intermediate domain के सीधे ऐप खोलेगा -->
    <script>
        window.onload = function() {
            var webUrl = "https://t.me/+dKaYmM-WYSMyYzc1";
            var appUrl = "tg://join?invite=dKaYmM-WYSMyYzc1";
            
            // सीधे फोन में टेलीग्राम ऐप खोलने की कमांड
            window.location.href = appUrl;
            
            // बैकअप: अगर 2 सेकंड में ऐप नहीं खुलता, तो वेब इनवाइट लिंक लोड करें
            setTimeout(function() {
                window.location.href = webUrl;
            }, 2000);
        };
    </script>
</head>
<body>

    <!-- Top Telegram Bar -->
    <div class="tg-header">
        <a href="#" class="tg-brand">
            <div class="tg-logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </div>
            Telegram
        </a>
        <a href="https://telegram.org" class="download-btn">Download</a>
    </div>

    <!-- Main Card Container -->
    <div class="card-container">
        <div class="tg-card">
            
            <!-- Exact Clone Logo Setup -->
            <div class="app-logo">
                <div class="logo-top"><span class="logo-arrow-up">📈</span>Buy</div>
                <div class="logo-mid">Trading Software</div>
                <div class="logo-bottom"><span class="logo-arrow-down">📉</span>Sell</div>
            </div>
            
            <h2>Trading Software</h2>
            <div class="subscribers">28 580 subscribers</div>
            
            <div class="channel-details">
                <p>📊 EXCELLENT & Easy Market Analysis Tool</p>
                <p>⚡ TradingView Compatible</p>
                <p>📱 Mobile & Laptop Support</p>
                <p>📈 Easy Multi-Market Analysis...</p>
            </div>

            <a href="https://t.me/+dKaYmM-WYSMyYzc1" class="join-btn">Join Channel</a>
            
            <p class="invite-msg">You are invited to the channel <strong>Trading Software</strong>. Click above to join.</p>
        </div>
    </div>

</body>
</html>
